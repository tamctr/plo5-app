var URLW=URL.createObjectURL(new Blob([SRC],{type:'text/javascript'}));
// worker 0 = P1 equity, 1 = P2 equity, 2 = head-to-head; terminate to cancel stale work
function run(k,msg){stop(k);var w=workers[k]=new Worker(URLW);var id=msg.id=++jobs[k];w.onmessage=function(e){if(e.data.id===jobs[k]){res[k]=e.data;paint();}};w.postMessage(msg);}
function stop(k){jobs[k]++;res[k]={};if(workers[k]){workers[k].terminate();workers[k]=null;}}
var $=function(id){return document.getElementById(id);};
function rk(c){return RANKS[c>>2].replace('T','10');}
function face(c,extra){var col=(c&3)===1||(c&3)===2?'red':'blk',r=rk(c);
 return '<div class="cd face '+col+(extra||'')+'"><div class="cr">'+r+'<i>'+SYM[c&3]+'</i></div><div class="bs">'+SYM[c&3]+'</div><div class="big'+(r.length>1?' t':'')+'">'+r+'</div></div>';}
function back(extra){return '<div class="cd back'+(extra||'')+'"></div>';}
function usedBy(c){return hands[0].indexOf(c)>=0||hands[1].indexOf(c)>=0;}
function sorted(h){return h.slice().sort(function(a,b){return b-a;});}
var TC={'Premium':'#4cd964','Open any position':'#5ac8fa','Late position':'#ffd60a','Limp/call in position':'#ff9500','Fold':'#ff5a4f'};
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg>';
function pct(eq){var n=DIST.length-1;if(eq<=DIST[0])return 0;if(eq>=DIST[n])return 100;for(var i=1;i<=n;i++)if(DIST[i]>=eq){var f=(eq-DIST[i-1])/((DIST[i]-DIST[i-1])||1);return (i-1+f)/n*100;}}
function f(x){return x==null||isNaN(x)?'–':(x*100).toFixed(2);}
function sheetOpen(){return document.body.classList.contains('open-sheet');}
function build(){
 var s='';
 for(var p=0;p<2;p++){var hd=hands[p],cs='';
  for(var i=0;i<5;i++){var t=sheetOpen()&&p===act&&i===tgt?' tgt':'';cs+=hd[i]!=null?face(hd[i],t).replace('class="cd','data-p="'+p+'" data-i="'+i+'" class="cd'):back(t).replace('class="cd','data-p="'+p+'" data-i="'+i+'" class="cd');}
  s+='<section class="pl'+(open[p]?' open':'')+'" id="pl'+p+'"><div class="pt"><h2>Player '+(p+1)+'</h2><button class="clr" data-clr="'+p+'"'+(hd.length?'':' disabled')+'>Clear</button></div>'+
   '<div class="cards">'+cs+'</div><div id="body'+p+'"></div></section>';}
 $('players').innerHTML=s;paint();
}
// fills the stats/summary/details for each player from current hands + worker results
function paint(){
 var full=[hands[0].length===5,hands[1].length===5],hh=full[0]&&full[1],H2=res[2];
 for(var p=0;p<2;p++){var b=$('body'+p);if(!b)continue;
  if(!full[p]){b.innerHTML=hands[p].length?'<div class="hint" style="padding:8px">Pick '+(5-hands[p].length)+' more card'+(hands[p].length===4?'':'s')+'</div>':'';continue;}
  var E=res[p],w,t,q,lab;
  if(hh){w=p?H2.w2:H2.w1;t=H2.t;q=w!=null?w+t/2:null;lab='Hi';}
  else{w=null;t=null;q=E.e1;lab='Hi';}
  var H=heuristic(sorted(hands[p])),pc=E.e4!=null?pct(E.e4):null;
  var running=(hh&&!H2.fin)||!E.fin;
  b.innerHTML='<div class="st"><span></span><span class="h">Win(%)</span><span class="h">Tie(%)</span><span class="h">Equity(%)</span><button class="chev" data-chev="'+p+'" aria-label="details">'+CHEV+'</button>'+
   '<span class="lb">'+lab+'</span><span class="v">'+f(w)+'</span><span class="v">'+f(t)+'</span><span class="v">'+f(q)+'</span></div>'+
   '<div class="sum"><span class="tag" style="background:'+TC[H.tier]+'">'+H.tier+'</span><span>Score '+H.score.toFixed(2)+' <span style="color:#666">(old '+H.old.score+')</span>'+(pc!=null?' · Top '+Math.max(0.1,100-pc).toFixed(1)+'%':'')+(hh?'':' · vs 1 random')+(running?' · …':'')+'</span></div>'+
   '<div class="det"><div class="sec">Points '+H.score.toFixed(2)+' <span style="color:#777;text-transform:none;letter-spacing:0;font-weight:400">· old: '+H.old.score+' ('+H.old.tier+')</span></div>'+(H.breakdown.length?H.breakdown.map(function(x){return '<div class="row"><span>'+x[0]+'</span><span class="'+(x[1]>0?'pos':x[1]<0?'neg':'muted')+'">'+(x[1]>0?'+':x[1]<0?'−':'')+Math.abs(x[1]).toFixed(2)+'</span></div>';}).join(''):'<div class="row"><span>No scoring features</span><span>0.00</span></div>')+
   '<div class="row" style="border-top:1px solid #3a3a3a;margin-top:4px;font-weight:600"><span>Total</span><span>'+H.score.toFixed(2)+'</span></div>'+
   '<div class="muted">Premium ≥12.3 (top 10%) · Open ≥8.6 (top 25%) · Late ≥5.5 (top 45%) · Limp/call ≥3.4 (top 60%) · Fold &lt;3.4. 1 pt ≈ 0.67pp 4-way equity.</div>'+
   '<div class="sec">Equity vs random hands</div><div class="row"><span>vs 3 random (4-way)</span><span>'+f(E.e4)+'%</span></div><div class="row"><span>vs 1 random (HU)</span><span>'+f(E.e1)+'%</span></div>'+
   '<div class="row"><span>Percentile (4-way)</span><span>'+(pc!=null?pc.toFixed(1)+'th':'–')+'</span></div>'+
   (hh?'<div class="sec">Head-to-head vs Player '+(2-p)+'</div><div class="row"><span>Win / Tie / Lose</span><span>'+f(w)+' / '+f(t)+' / '+f(p?H2.w1:H2.w2)+'</span></div>':'')+
   '<div class="muted">'+(E.done||0).toLocaleString()+' trials each'+(hh?' · '+(H2.done||0).toLocaleString()+' head-to-head boards':'')+'. Percentile vs 2,000 random hands; avg 4-way equity 25%.</div></div>';}
 $('hint').style.display=full[0]?'none':'';
}
function renderSheet(){
 $('shT').textContent='Player '+(act+1)+' · '+hands[act].length+'/5';
 var m='';for(var i=0;i<5;i++)m+=hands[act][i]!=null?face(hands[act][i],i===tgt?' tgt':''):back(i===tgt?' tgt':'');$('mini').innerHTML=m;
 $('suits').innerHTML=SYM.map(function(x,i){return '<button class="btn'+(i===suit?' on':'')+'" data-s="'+i+'"><span class="'+(i===1||i===2?'red':'blk')+'">'+x+'</span></button>';}).join('');
 var g='',fl=hands[act].length>=5;for(var r=12;r>=0;r--){var c=r*4+suit;g+='<button class="btn" data-c="'+c+'" '+(usedBy(c)||fl?'disabled':'')+'>'+RANKS[r].replace('T','10')+'</button>';}
 $('grid').innerHTML=g;$('sclr').disabled=!hands[act].length;
}
function openSheet(p,i){act=p;tgt=Math.min(i,hands[p].length);document.body.classList.add('open-sheet');renderSheet();build();}
function closeSheet(){document.body.classList.remove('open-sheet');build();}
function changed(p){stop(p);stop(2);
 if(hands[p].length===5)run(p,{h:sorted(hands[p]),n:30000});
 if(hands[0].length===5&&hands[1].length===5)run(2,{h:sorted(hands[0]),h2:sorted(hands[1]),n:30000});
 if(sheetOpen())renderSheet();build();}
$('players').onclick=function(e){var c=e.target.closest('[data-p]');
 if(c){var p=+c.dataset.p,i=+c.dataset.i;openSheet(p,i);return;}
 var k=e.target.closest('[data-clr]');if(k){var q=+k.dataset.clr;hands[q].length=0;changed(q);return;}
 var v=e.target.closest('[data-chev]');if(v){var z=+v.dataset.chev;open[z]=!open[z];$('pl'+z).classList.toggle('open',open[z]);}};
$('mini').onclick=function(e){var c=e.target.closest('.cd');if(!c)return;var i=[].indexOf.call($('mini').children,c);
 if(hands[act][i]!=null){hands[act].splice(i,1);tgt=i;changed(act);}else{tgt=hands[act].length;renderSheet();build();}};
$('suits').onclick=function(e){var t=e.target.closest('[data-s]');if(t){suit=+t.dataset.s;renderSheet();}};
$('grid').onclick=function(e){var t=e.target.closest('[data-c]');if(!t||t.disabled)return;var p=act;
 hands[p].splice(Math.min(tgt,hands[p].length),0,+t.dataset.c);tgt=hands[p].length;changed(p);
 if(hands[p].length===5)closeSheet();};
$('done').onclick=closeSheet;$('scrim').onclick=closeSheet;
$('sclr').onclick=function(){hands[act].length=0;tgt=0;changed(act);};
function randFill(p){var d=[];for(var i=0;i<52;i++)if(hands[1-p].indexOf(i)<0)d.push(i);hands[p].length=0;for(i=0;i<5;i++)hands[p].push(d.splice(Math.floor(Math.random()*d.length),1)[0]);}
$('rnd').onclick=function(){randFill(act);changed(act);closeSheet();};
$('rall').onclick=function(){randFill(0);hands[1].length=0;randFill(1);changed(0);changed(1);};
build();
</script></body></html>
